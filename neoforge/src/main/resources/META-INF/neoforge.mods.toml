modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL="https://github.com/colduw/CosmeticArmorNext/issues"
[[mods]]
modId = "${mod_id}"
displayURL="https://github.com/colduw/CosmeticArmorNext"
updateJSONURL="${updateURLNeoForge}"
logoFile = "canvs.png"
iconFile = "canvs.png"
version = "${mod_version}"
displayName = "${mod_name}"
credits = "dmillerw - original author; azanor - some code learned from baubles; izuminya - button icon; Deph0 and sblectric for their support when i'm absent"
authors = "${mod_authors}"
displayTest = "MATCH_VERSION"
description = '''${mod_description}'''

[[dependencies.${ mod_id }]]
modId = "neoforge"
mandatory = true
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[mixins]]
config = "${mod_id}-mixins.json"

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"